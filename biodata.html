<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Biodata Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Biodata Form</h2>
        <form id="biodataForm" action="/api/biodata" method="post">
            <label for="participant_id">Participant ID:</label>
            <input type="number" id="participant_id" name="participant_id" required>

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" required>

            <label for="contact">Contact Number:</label>
            <input type="text" id="contact" name="contact" required>

            <label for="guardian">Guardian Name:</label>
            <input type="text" id="guardian" name="guardian" required>

            <input type="submit" value="Submit Biodata">
        </form>
        <div id="loader" class="loader" style="display:none;"></div>
    </div>

    <script>
      const form = document.getElementById('biodataForm');
      const loader = document.getElementById('loader');
      form.addEventListener('submit', () => loader.style.display = 'block');
    </script>
</body>
</html>
