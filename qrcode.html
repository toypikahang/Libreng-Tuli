<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QR Code Confirmation</title>
</head>
<body>
  <h2>Your QR Code</h2>
  <img id="qrImage" alt="QR Code">
  <script>
    fetch('/api/qrcode?id=1')
      .then(res => res.json())
      .then(data => {
        document.getElementById('qrImage').src = data.qr;
      });
  </script>
</body>
</html>
