<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Face Photo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Upload Face Photo</h2>
        <form id="faceForm" action="/api/faceupload" method="post" enctype="multipart/form-data">
            <label>Select photo:</label>
            <input type="file" name="face" accept="image/*" required>
            <input type="submit" value="Upload Photo">
        </form>
        <div id="loader" class="loader" style="display:none;"></div>
    </div>

    <script>
      const form = document.getElementById('faceForm');
      const loader = document.getElementById('loader');
      form.addEventListener('submit', () => loader.style.display = 'block');
    </script>
</body>
</html>
